<title id="t">HYDRA-UMC-BRIDGE-CNC architecture</title>
<desc id="d">HYDRA-UMC-BRIDGE-CNC reads the state of a CNC controller (GRBL, LinuxCNC or CNCjs) and the E-STOP and door of the cell, turns it into a cell snapshot and passes every job through the shared evaluate_job gate of HYDRA-UMC-SDK; the answers go out over MQTT. The controller keeps trajectory, spindle and limit authority.</desc>
