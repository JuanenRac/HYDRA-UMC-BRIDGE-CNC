#
# Runs the bridge against its emulators and fakes only (no hardware, no controller, no vehicle). See docs/SIMULATION.md.
# It runs on every push and pull request, by hand, and once a week.
# =============================================================================
name: Simulation bench

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  simulation:
    name: Run the emulators and fakes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the SDK contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JuanenRac/HYDRA-UMC-SDK
          path: .hydra-umc-sdk-contract
          ref: v0.5.8
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install the optional transport libraries
        run: python -m pip install "pyserial>=3.5" "paho-mqtt>=2.1,<3"
      - name: Run the emulators and fakes
        working-directory: tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: "${{ github.workspace }}/src:${{ github.workspace }}/.hydra-umc-sdk-contract/clients/python/src"
        run: >
          python -m unittest -v
          test_grbl_emulator
          test_serial_pty
          test_serial_transport
          test_controllers
          test_cell
          test_mqtt_transport
          test_broker_integration
          test_global_stop_broker
