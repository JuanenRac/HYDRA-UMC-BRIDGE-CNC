name: Notify central ecosystem dashboard
on:
  push:
    branches: [main]
permissions: {}
jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      DASHBOARD_DISPATCH_TOKEN: "${{ secrets.ECOSYSTEM_DASHBOARD_DISPATCH_TOKEN }}"
    steps:
      - name: Request refresh when configured
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DASHBOARD_DISPATCH_TOKEN:-}" ]]; then
            echo "Dashboard dispatch is not configured; scheduled discovery will update it."
            exit 0
          fi
          payload="$(jq -nc --arg repository "${{ github.repository }}" --arg ref "${{ github.ref }}" --arg sha "${{ github.sha }}" '{event_type: "ecosystem_project_updated", client_payload: {repository: $repository, ref: $ref, sha: $sha}}')"
          curl --fail-with-body --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 --request POST --header "Accept: application/vnd.github+json" --header "Authorization: Bearer ${DASHBOARD_DISPATCH_TOKEN}" --header "X-GitHub-Api-Version: 2022-11-28" --url "https://api.github.com/repos/JuanenRac/JuanenRac/dispatches" --data "${payload}"
