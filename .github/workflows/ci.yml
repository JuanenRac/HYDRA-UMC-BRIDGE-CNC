name: HYDRA-UMC CI baseline
on: [push, pull_request, workflow_dispatch]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {repository: JuanenRac/HYDRA-UMC-SDK, path: .hydra-umc-sdk-contract, ref: v0.5.9, persist-credentials: false}
      - name: Run the baseline steps of the family
        uses: ./.github/actions/hydra-baseline
        with:
          lint: full
          lint-requirements: "./.hydra-umc-sdk-contract/clients/python pyserial>=3.5"
      - name: Install pyserial for the pseudo-terminal serial tests
        run: python -m pip install "pyserial>=3.5"
      - name: Run non-mutating bridge verification
        env:
          HYDRA_UMC_SDK_ROOT: "${{ github.workspace }}/.hydra-umc-sdk-contract"
        run: python tools/build_test.py
      - name: Verify isolated incremental version workflow
        run: |
          check_dir="$(mktemp -d)"
          trap 'rm -rf "$check_dir"' EXIT
          mkdir -p "$check_dir/tools"
          cp hydra-umc.project.json pyproject.toml CHANGELOG.md "$check_dir/"
          cp tools/bump_version.py "$check_dir/tools/"
          python "$check_dir/tools/bump_version.py"
          python - "$check_dir" <<'PY'
          import json, re, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          manifest = json.loads((root / "hydra-umc.project.json").read_text())
          native = re.search(r'(?m)^version\s*=\s*"(\d+\.\d+\.\d+(?:\.\d+)?)"', (root / "pyproject.toml").read_text()).group(1)
          assert manifest["version"] == native
          assert f"## [{native}]" in (root / "CHANGELOG.md").read_text()
          print(f"INCREMENTAL_VERSION_CONTRACT=PASS version={native}")
          PY

  coverage:
    name: Test coverage (with a floor that does not go down)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the SDK contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JuanenRac/HYDRA-UMC-SDK
          path: .hydra-umc-sdk-contract
          ref: v0.5.9
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Measure line and branch coverage of the package
        env:
          PYTHONPATH: "${{ github.workspace }}/src:${{ github.workspace }}/.hydra-umc-sdk-contract/clients/python/src"
        run: |
          python -m pip install coverage "paho-mqtt>=2.1,<3"
          python -m coverage run --branch --source=src -m unittest discover -s tests
          python -m coverage report --skip-empty --fail-under=90
